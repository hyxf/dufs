  <main class="main">
    <section class="index-page hidden" aria-label="Directory contents">
      <h1 class="folder-title hidden" aria-hidden="true"></h1>
      <div class="upload-queue hidden">
        <div class="queue-heading"><h2>Transfers</h2><span class="queue-count"></span></div>
        <table class="uploaders-table">
          <thead><tr><th class="cell-name" colspan="2">File</th><th class="cell-status">Status</th><th class="cell-size">Size</th><th class="cell-percent">Progress</th><th class="cell-speed">Speed</th><th class="cell-eta">Time left</th></tr></thead>

        </table>
      </div>
      <div class="drop-overlay hidden" aria-hidden="true"><div class="drop-message"><span class="drop-symbol">↑</span><strong>Drop files to upload</strong><span>Files will be added to this folder</span></div></div>
      <div class="empty-folder hidden"></div>
      <div class="table-scroll"><table class="paths-table hidden" aria-label="Files and folders"><thead></thead><tbody></tbody></table></div>
      <footer class="index-footer"><p class="folder-summary"></p></footer>
    </section>
    <section class="editor-page hidden" aria-label="File editor">
      <div class="editor-toolbar"><div><span class="editor-label"></span><span class="editor-status"></span></div></div>
      <div class="not-editable hidden"></div>
      <textarea id="editor" class="editor hidden" aria-label="File content" cols="10" spellcheck="false"></textarea>
    </section>
  </main>

      <h2 id="dialog-title"></h2>
      <p class="dialog-message hidden"></p>

      <div class="dialog-actions"><button type="button" class="dialog-cancel">Cancel</button><button type="button" class="dialog-submit">Continue</button></div>
    </form>
  </dialog>

  <div class="toast-region" aria-live="polite" aria-atomic="false"></div>
